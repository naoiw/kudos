name: Validate Kudos
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Vite app for GitHub Pages
        env:
          PATH_PREFIX: /kudos
        run: pnpm build

      - name: Validate GAS sources and clasp sync allowlist
        run: node scripts/verify-gas-sync.cjs

      - name: Test Apps Script parser, ingestion, and clasp safety
        run: node --test gas/tests/*.test.cjs scripts/tests/*.test.cjs
