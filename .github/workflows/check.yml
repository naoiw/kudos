name: Validate Kudos
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Vite app for GitHub Pages
        env:
          PATH_PREFIX: /kudos
        run: pnpm build

      - name: Check shared sport rules and GAS source safety
        run: |
          node scripts/generate-sport-rules.cjs --check
          node scripts/verify-gas-sync.cjs

      - name: Test Apps Script parser, shared sport contract, and clasp safety
        run: node --test gas/tests/*.test.cjs scripts/tests/*.test.cjs

      - name: Check real clasp 3.4.1 file selection without authentication
        run: |
          set -euo pipefail
          trap 'rm -f .clasp.json' EXIT
          node -e "require('node:fs').writeFileSync('.clasp.json', JSON.stringify({scriptId: '1'.repeat(57), rootDir: 'gas'}))"
          npx --yes @google/clasp@3.4.1 show-file-status --json > "$RUNNER_TEMP/clasp-file-status.json"
          node scripts/verify-gas-sync.cjs "$RUNNER_TEMP/clasp-file-status.json"

  windows-sport-rules:
    runs-on: windows-latest
    steps:
      - name: Enable Windows Git CRLF checkout
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify CRLF checkout and generated GAS rules
        shell: pwsh
        run: |
          node -e "const f=require('fs').readFileSync('gas/00_Config.gs','utf8'); if(!f.includes('\r\n')) process.exit(1)"
          node scripts/verify-gas-sync.cjs
          node --test scripts/tests/generate-sport-rules.test.cjs
