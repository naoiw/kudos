name: Deploy Kudos to GitHub Pages

# Pages is a single website: deploy production and preview together, never
# replace the entire site with only the branch that triggered the run.
on:
  push:
    branches: [main]
  # This runs on the default branch after develop CI passes, keeping the
  # Pages deployment workflow trusted and the preview gated by validation.
  workflow_run:
    workflows: [Validate Kudos]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - name: Checkout preview (develop)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'develop' }}
          path: preview
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.9.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: stable/pnpm-lock.yaml
      - name: Install production dependencies
        run: pnpm --dir stable install --frozen-lockfile
      - name: Reuse only main-approved public data in preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf preview/public/data
          cp -a stable/public/data preview/public/data
          cmp stable/public/data/preview.json preview/public/data/preview.json
      - name: Install preview dependencies
        run: pnpm --dir preview install --frozen-lockfile
      - name: Build production at /kudos/
        run: pnpm --dir stable build
        env:
          PATH_PREFIX: /kudos
      - name: Build preview at /kudos/develop/
        run: pnpm --dir preview build
        env:
          PATH_PREFIX: /kudos/develop
      - name: Assemble a single Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/develop
          cp -a stable/dist/. site/
          cp -a preview/dist/. site/develop/
          test -s site/index.html
          test -s site/develop/index.html
          test -s site/data/preview.json
          test -s site/develop/data/preview.json
          # Preserve both base paths, including the public GPS chunk URLs.
          grep -q '/kudos/assets/' site/index.html
          grep -q '/kudos/develop/assets/' site/develop/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production and preview to Pages
        id: deployment
        uses: actions/deploy-pages@v4
